<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5">
    <h1 class="text-3xl font-bold mb-5">Latest Anime</h1>
    <div id="anime-list" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

    <script>
        fetch('https://api.consumet.org/anime/gogoanime/recent-episodes')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('anime-list');
            data.results.forEach(anime => {
                container.innerHTML += `
                    <div class="bg-gray-900 p-3 rounded">
                        <img src="${anime.image}" class="w-full h-60 object-cover rounded">
                        <h2 class="mt-2 text-sm">${anime.title}</h2>
                    </div>`;
            });
        });
    </script>
</body>
</html>
